name: Refresh public hero references
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/collect-references.cjs'
      - '.github/workflows/references.yml'
permissions:
  contents: write
concurrency:
  group: public-hero-references
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Collect public measurements
        env:
          PROFILE_BUDGET: '900'
        run: node scripts/collect-references.cjs
      - name: Save reference data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add references/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh public hero reference data'
          git pull --rebase origin main
          git push origin HEAD:main
